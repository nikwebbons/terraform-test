name: Terraform
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  terraform:
    runs-on:
      - codebuild-terraform-test-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config=bucket="${{ secrets.S3_BUCKET_NAME }}" \
            -backend-config=key="tfstate/default.tfstate" \
            -backend-config=region="eu-west-2"
            
      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        run: terraform plan -var-file=env/env.tfvars
        
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -var-file=env/env.tfvars